name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Extract Plugin Info and Rename Artifact
      id: plugin_info
      run: |
        VERSION=$(grep -oP '(?<=<PluginVersion>).*?(?=</PluginVersion>)' LazerLens.csproj | tr -d '\r')
        ID=$(grep -oP '(?<=<PluginId>).*?(?=</PluginId>)' LazerLens.csproj | tr -d '\r')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "ID=$ID" >> $GITHUB_OUTPUT
        
        # Rename the zip file generated by osucc.Build
        mv "bin/Release/net8.0/${ID}.zip" "bin/Release/net8.0/${ID}-${VERSION}.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.plugin_info.outputs.ID }}-${{ steps.plugin_info.outputs.VERSION }}
        path: bin/Release/net8.0/${{ steps.plugin_info.outputs.ID }}-${{ steps.plugin_info.outputs.VERSION }}.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: bin/Release/net8.0/${{ steps.plugin_info.outputs.ID }}-${{ steps.plugin_info.outputs.VERSION }}.zip
