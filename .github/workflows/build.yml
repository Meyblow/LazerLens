name: Build Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Rename Artifact
      id: rename
      run: |
        PLUGIN_ID=$(grep -oP '(?<=<PluginId>).*?(?=</PluginId>)' LazerLens.csproj | tr -d '\r')
        PLUGIN_VERSION=$(grep -oP '(?<=<PluginVersion>).*?(?=</PluginVersion>)' LazerLens.csproj | tr -d '\r')
        mv bin/Release/net8.0/$PLUGIN_ID.zip bin/Release/net8.0/$PLUGIN_ID-$PLUGIN_VERSION.zip
        echo "artifact_name=$PLUGIN_ID-$PLUGIN_VERSION" >> $GITHUB_ENV
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact_name }}
        path: bin/Release/net8.0/*.zip
    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net8.0/*.zip
        generate_release_notes: true

