name: Build Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Pack osu-cc local packages
      run: |
        git clone --depth 1 https://github.com/rus07tam/osu-cc.git /tmp/osu-cc
        mkdir -p local_feed
        FEED_DIR=$(pwd)/local_feed
        cd /tmp/osu-cc
        dotnet pack osucc.Shared/osucc.Shared.csproj -c Release -p:OsuCcSharedVersion=2.0.2 -p:OsuCcHostVersion=2.2.0 -p:OsuCcBuildVersion=2.2.0 -o "$FEED_DIR"
        dotnet pack osucc.Api/osucc.Api.csproj -c Release -p:OsuCcSharedVersion=2.0.2 -p:OsuCcHostVersion=2.2.0 -p:OsuCcBuildVersion=2.2.0 -o "$FEED_DIR"
        dotnet pack build/osucc.Build/osucc.Build.csproj -c Release -p:OsuCcSharedVersion=2.0.2 -p:OsuCcHostVersion=2.2.0 -p:OsuCcBuildVersion=2.2.0 -o "$FEED_DIR"
        cd -

    - name: Restore dependencies
      run: dotnet restore -s https://api.nuget.org/v3/index.json -s $(pwd)/local_feed

    - name: Build plugin
      run: dotnet build -c Release --no-restore

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lazer-lens-build
        path: bin/Release/net8.0/*.zip

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net8.0/*.zip
        generate_release_notes: true

