name: Build Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build osu-cc local packages
      run: |
        git clone --depth 1 https://github.com/rus07tam/osu-cc.git ../osu-cc
        dotnet build ../osu-cc/osucc.build.proj -t:PackPackages -c Release
        mkdir -p local_feed
        cp ../osu-cc/artifacts/nuget/*.nupkg local_feed/
        dotnet nuget add source $(pwd)/local_feed -n osu-cc-local

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lazer-lens-build
        path: bin/Release/net8.0/*.zip

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net8.0/*.zip
        generate_release_notes: true

