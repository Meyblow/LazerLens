name: Build Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Clone osu-cc and Build Plugin
      run: |
        git clone --depth 1 https://github.com/rus07tam/osu-cc.git ../osu-cc
        mkdir -p ../osu-cc/plugins/LazerLens
        cp -r ./* ../osu-cc/plugins/LazerLens/
        cd ../osu-cc
        dotnet build osucc.build.proj -t:PackBootstrapBundle -c Release
        cd -
        mkdir -p bin/Release/net8.0
        cp ../osu-cc/plugins/LazerLens/bin/Release/net8.0/*.dll bin/Release/net8.0/
        cp ../osu-cc/plugins/LazerLens/bin/Release/net8.0/*.zip bin/Release/net8.0/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lazer-lens-build
        path: bin/Release/net8.0/*.zip

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net8.0/*.zip
        generate_release_notes: true

